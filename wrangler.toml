name = "teman-tutor-web"
main = ".open-next/worker.js"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_SITE_NAME = "Teman Tutor"

# Add secrets via: wrangler secret put RESEND_API_KEY
# Secrets: RESEND_API_KEY, LEAD_NOTIFICATION_EMAIL, LEAD_FROM_EMAIL, APP_SECRET
# Public vars: NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_WA_NUMBER, NEXT_PUBLIC_GA_ID, etc.
